services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - eventapp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapp"]
      interval: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - eventapp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 2s
      retries: 15
volumes:
  eventapp_data:
  eventapp_redis:
