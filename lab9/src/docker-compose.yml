services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eventapp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventapp"]
      interval: 3s
      retries: 15
volumes:
  eventapp_data:
